experiment_id: EXP-102-NON-NATIVE-SELF-SUPERVISED-ADAPTATION
hypothesis_id: H97-non-native-ssl-adaptation
method_id: M102-ssl-lora-adapter-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
  dev_replication: 300
  test_sealed: 600
device: cuda
model:
  name: PEAR-Net
  in_acoustic_dim: 72
  in_prompt_dim: 47
  in_gap_dim: 13
  lora_rank: 8
  lora_alpha: 16.0
  lora_scale: 2.0
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  disentangled_subspaces:
    manner: 32
    place: 32
    voicing: 16
    timbre: 48
  orthogonality_penalty: true
  reconstruction_mse: true
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
tags:
  - parameter_efficient_acoustic_refiner
  - pear_net
  - non_native_ssl_lora_adaptation
  - identity_residual_mapping
  - phase_2_frontier
  - zero_leakage_enforced
