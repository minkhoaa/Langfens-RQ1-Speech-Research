experiment_id: EXP-105-CROSS-CORPUS-FULL-TRAINING-EXPANSION
hypothesis_id: H100-cross-corpus-joint-training
method_id: M105-joint-corpus-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800 L2-ARCTIC + 200 SpeechOcean762 (2000 total)
  dev_search: 599 L2-ARCTIC
  dev_cal: 300 L2-ARCTIC
  dev_replication: 300 L2-ARCTIC
  speechocean_test: 300 SpeechOcean762
  test_sealed: 600
device: cuda
model:
  name: JCCM-Net
  in_acoustic_dim: 72
  in_prompt_dim: 47
  in_gap_dim: 13
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  disentangled_subspaces:
    manner: 32
    place: 32
    voicing: 16
    timbre: 48
  multi_corpus_co_training: true
  speechocean_soft_targets: true
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
  - speechocean762_test
tags:
  - joint_cross_corpus_multi_accent_trainer
  - jccm_net
  - multi_corpus_co_training
  - zero_shot_domain_generalization
  - phase_2_frontier
  - zero_leakage_enforced
