experiment_id: EXP-81-SUBFRAME-TEMPORAL-CONTRASTIVE-ALIGNER
hypothesis_id: H76-subframe-contrastive-alignment
method_id: M81-subframe-contrastive-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
  dev_replication: 300
  test_sealed: 600
device: cuda
model:
  name: STCA-Net
  in_acoustic_dim: 72
  in_prompt_dim: 47
  in_gap_dim: 13
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  contrastive_boundary_margin: 1.5
  multi_resolution_pyramid: 4_scales_2p5ms_to_20ms
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
tags:
  - subframe_temporal_contrastive_aligner
  - stca_net
  - boundary_sharpening_loss
  - monotonic_local_attention
  - zero_leakage_enforced
