experiment_id: EXP-94-ARTICULATORY-DISENTANGLED-AUTOENCODER
hypothesis_id: H89-articulatory-disentangled-autoencoder
method_id: M94-articulatory-autoencoder-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
  dev_replication: 300
  test_sealed: 600
device: cuda
model:
  name: ADAE-Net
  in_acoustic_dim: 72
  in_prompt_dim: 47
  in_gap_dim: 13
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  disentangled_subspaces:
    manner: 32
    place: 32
    voicing: 16
    timbre: 48
  orthogonality_penalty: true
  reconstruction_mse: true
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
tags:
  - articulatory_disentangled_autoencoder
  - adae_net
  - orthogonal_subspace_covariance
  - timbre_decoupling
  - zero_leakage_enforced
