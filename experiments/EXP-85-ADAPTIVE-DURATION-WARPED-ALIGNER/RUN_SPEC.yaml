experiment_id: EXP-85-ADAPTIVE-DURATION-WARPED-ALIGNER
hypothesis_id: H80-adaptive-duration-warping
method_id: M85-adaptive-duration-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
  dev_replication: 300
  test_sealed: 600
device: cuda
model:
  name: ADWA-Net
  in_acoustic_dim: 67
  in_prompt_dim: 47
  in_gap_dim: 13
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  adaptive_attention: dynamic_duration_ratio_bandwidth_scaling
  sigma_range: [1.2, 6.0]
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
tags:
  - adaptive_duration_warped_aligner
  - adwa_net
  - speaking_rate_normalization
  - dynamic_gaussian_bandwidth
  - zero_leakage_enforced
