experiment_id: EXP-74-VTLN-WARPED-CEPSTRAL-ADAPTER
hypothesis_id: H69-vtln-warped-cepstral-adaptation
method_id: M74-vtln-cepstral-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
