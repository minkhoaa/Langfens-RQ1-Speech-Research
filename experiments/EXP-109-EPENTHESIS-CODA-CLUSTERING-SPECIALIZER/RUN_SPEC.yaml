experiment_id: EXP-109-EPENTHESIS-CODA-CLUSTERING-SPECIALIZER
hypothesis_id: H104-epenthesis-coda-clustering
method_id: M109-epenthesis-specializer-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
  dev_replication: 300
  test_sealed: 600
device: cuda
model:
  name: CREC-Net
  in_acoustic_dim: 72
  in_prompt_dim: 47
  in_gap_dim: 16
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  coda_dynamics_features: 3
  coda_focal_loss: true
  disentangled_subspaces:
    manner: 32
    place: 32
    voicing: 16
    timbre: 48
  orthogonality_penalty: true
  reconstruction_mse: true
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
tags:
  - coda_release_epenthesis_specializer
  - crec_net
  - post_coda_vocalic_energy_ratio
  - coda_focal_loss
  - phase_2_frontier
  - zero_leakage_enforced
