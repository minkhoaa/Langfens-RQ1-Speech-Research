experiment_id: EXP-91-BOUNDARY-AWARE-PHONOTACTIC-POSTERIOR-MAPPER
hypothesis_id: H86-boundary-phonotactic-posterior-mapping
method_id: M91-boundary-posterior-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
  dev_replication: 300
  test_sealed: 600
device: cuda
model:
  name: BAPM-Net
  in_acoustic_dim: 72
  in_prompt_dim: 47
  in_gap_dim: 13
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  acoustic_boundary_certainty_gating: true
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
tags:
  - boundary_aware_phonotactic_posterior_mapper
  - bapm_net
  - acoustic_certainty_gating
  - temporal_pyramid_cross_attention
  - zero_leakage_enforced
