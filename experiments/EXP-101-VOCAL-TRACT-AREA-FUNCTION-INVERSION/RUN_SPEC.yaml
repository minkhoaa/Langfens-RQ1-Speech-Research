experiment_id: EXP-101-VOCAL-TRACT-AREA-FUNCTION-INVERSION
hypothesis_id: H96-vocal-tract-area-inversion
method_id: M101-vocal-tract-inversion-trainer
protocol: PROTOCOL_ALPHA_TARGET_MONOTONIC_V1
split:
  train: 1800
  dev_search: 599
  dev_cal: 300
  dev_replication: 300
  test_sealed: 600
device: cuda
model:
  name: VTI-Net
  in_acoustic_dim: 80
  in_prompt_dim: 47
  in_gap_dim: 13
  cross_attention_heads: 4
  proj_dim: 128
  lstm_hidden: 96
  vocal_tract_area_functions: 8
  disentangled_subspaces:
    manner: 32
    place: 32
    voicing: 16
    timbre: 48
  orthogonality_penalty: true
  physical_reconstruction_mse: true
  interlanguage_priors: true
  triad_gap_categories: 3
  epochs: 10
  lr: 0.001
calibration_split: dev_cal
evaluation_splits:
  - dev_search
  - dev_replication
tags:
  - vocal_tract_area_function_inversion
  - vti_net
  - acoustic_tube_reflection_coefficients
  - physical_articulatory_constriction_inversion
